services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: agent -dev -ui -client=0.0.0.0
    ports:
      - '8500:8500'
      - '8600:8600/tcp'
      - '8600:8600/udp'
    healthcheck:
      test: ['CMD', 'consul', 'members']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CONSUL_URL: http://consul:8500
      NODE_ENV: production
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5

  item-service:
    build: ./item-service
    container_name: item-service
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: ${ITEM_DATABASE_URL}
      PORT: 3001
      AUTH_SERVICE_URL: http://auth-service:3000
      CONSUL_URL: http://consul:8500
      NODE_ENV: production
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      retries: 5

  orders-service:
    build: ./orders-service
    container_name: orders-service
    ports:
      - '3002:3002'
    environment:
      DATABASE_URL: ${ORDERS_DATABASE_URL}
      PORT: 3002
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      ITEM_SERVICE_URL: http://item-service:3001
      AUTH_SERVICE_URL: http://auth-service:3000
      CONSUL_URL: http://consul:8500
      NODE_ENV: production
    depends_on:
      rabbitmq:
        condition: service_healthy
      item-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3002/health']
      interval: 10s
      timeout: 5s
      retries: 5

  kitchen-service:
    build: ./kitchen-service
    container_name: kitchen-service
    ports:
      - '3012:3012'
    environment:
      DATABASE_URL: ${KITCHEN_DATABASE_URL}
      PORT: 3012
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_SERVICE_URL: http://auth-service:3000
      CONSUL_URL: http://consul:8500
      SERVICE_PORT: 3012
      NODE_ENV: production
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3012/health']
      interval: 10s
      timeout: 5s
      retries: 5

  rider-service:
    build: ./rider-service
    container_name: rider-service
    ports:
      - '3011:3011'
    environment:
      DATABASE_URL: ${RIDER_DATABASE_URL}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      HEALTH_PORT: 3011
      CONSUL_URL: http://consul:8500
      NODE_ENV: production
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3011/health']
      interval: 10s
      timeout: 5s
      retries: 5